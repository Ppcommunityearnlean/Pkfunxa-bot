<!DOCTYPE html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071722"><title>AIKOLIN HOME — Today Detail V1</title><style>
:root{--text:#f7fbff;--muted:#9db1bf;--line:rgba(255,255,255,.10);--green:#39c77a;--blue:#5aa7ff;--orange:#ff9a3d;--yellow:#ffca3a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06131d,#0a1c29 50%,#06131d);color:var(--text);font-family:"Noto Sans Myanmar","Pyidaungsu",system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:460px;margin:auto;min-height:100vh;background:rgba(5,18,28,.82)}.top{padding:16px 18px 12px;border-bottom:1px solid var(--line)}.brand{font-size:18px;font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:3px}.content{padding:16px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.back{color:white;text-decoration:none;font-size:22px;margin-right:8px}.tag{padding:5px 7px;border-radius:999px;font-size:9px;border:1px solid var(--line);background:rgba(90,167,255,.14);color:#a8d0ff}.card{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:rgba(255,255,255,.035)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.box{padding:11px;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid var(--line)}.tiny{font-size:11px}.muted{color:var(--muted)}.box .tiny{display:block;margin-bottom:4px}.gate{padding:10px;border-radius:10px;border:1px solid rgba(255,154,61,.28);background:rgba(255,154,61,.10);color:#ffcf9f;font-size:11px;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border-radius:10px;padding:11px 6px;font-size:11px;border:1px solid var(--line)}.done{background:var(--blue);color:#06131d;font-weight:800}.follow{background:rgba(255,154,61,.18);color:#ffcf9f}.verify{width:100%;background:rgba(57,199,122,.14);color:#87efb3;margin-top:10px}.log{padding:10px 0;border-bottom:1px solid var(--line)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#102b3c;border:1px solid var(--line);padding:10px 14px;border-radius:12px;color:white;font-size:11px;opacity:0;transition:.2s;max-width:88vw;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}</style></head><body><div class="app"><div class="top"><div class="brand">⚡ AIKOLIN HOME <span style="color:var(--yellow)">V1.1</span></div><div class="sub">Today — Top 3 Priority Control V1</div></div><main class="content"><div class="head"><div><a class="back" href="./today-preview.html">‹</a><strong id="title">Priority Detail</strong></div><span class="tag" id="status">PENDING</span></div>
<div class="card"><div class="grid"><div class="box"><span class="tiny muted">Area</span><b id="area">—</b></div><div class="box"><span class="tiny muted">Priority</span><b>Top 3</b></div><div class="box"><span class="tiny muted">Owner</span><b id="owner">—</b></div><div class="box"><span class="tiny muted">Evidence</span><b id="evidence">—</b></div></div><div class="tiny muted" id="why" style="margin-top:10px">—</div></div>
<div class="card"><h3 style="margin-top:0">Control</h3><div class="gate" id="gate">Done blocked: verify evidence first.</div><button class="btn verify" id="verify">Mark Evidence Verified — Demo</button><div class="actions"><button class="btn done" id="done" disabled>Done</button><button class="btn follow" id="follow">Follow-up</button></div></div>
<div class="card"><h3 style="margin-top:0">Action Log</h3><div id="log" class="tiny muted">No action recorded yet.</div></div></main></div><div class="toast" id="toast"></div>
<script>
const data={t1:{title:'Daily Close Evidence Review',area:'Money / Stock',owner:'Control flow',evidence:'Daily close evidence',why:'Purpose: verify the day-close evidence before marking this priority complete.'},t2:{title:'Team Blocker Check',area:'Team',owner:'Team / Control',evidence:'Blocker or follow-up note',why:'Purpose: surface only exceptions, blockers, or support needs.'},t3:{title:'Personal Priority Follow-up',area:'Personal',owner:'Ko Lin',evidence:'Follow-up confirmation',why:'Purpose: keep one important personal follow-up visible without overloading the Home screen.'}};
const id=new URLSearchParams(location.search).get('id')||'t1',r=data[id]||data.t1,key='aikolin_today_v1';
function state(){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch(e){return{}}} function save(v){localStorage.setItem(key,JSON.stringify(v))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function render(){const s=state()[id]||{},status=document.getElementById('status'),done=document.getElementById('done'),gate=document.getElementById('gate'),verify=document.getElementById('verify');if(s.status){status.textContent=s.status.toUpperCase();}else status.textContent='PENDING';if(s.verified){gate.textContent='Completion gate cleared: evidence is VERIFIED.';gate.style.color='#87efb3';gate.style.borderColor='rgba(57,199,122,.28)';gate.style.background='rgba(57,199,122,.10)';verify.textContent='Evidence Verified — Demo';done.disabled=false;done.style.opacity='1'}else{gate.textContent='Done blocked: verify evidence first.';done.disabled=true;done.style.opacity='.45'}const logs=s.logs||[];document.getElementById('log').innerHTML=logs.length?logs.slice().reverse().map(x=>'<div class="log"><b>'+x.action+'</b><div class="tiny muted">'+new Date(x.at).toLocaleString()+' · local training record</div></div>').join(''):'No action recorded yet.'}
document.getElementById('title').textContent=r.title;document.getElementById('area').textContent=r.area;document.getElementById('owner').textContent=r.owner;document.getElementById('evidence').textContent=r.evidence;document.getElementById('why').textContent=r.why;
document.getElementById('verify').onclick=()=>{const all=state();const s=all[id]||{logs:[]};s.verified=true;all[id]=s;save(all);render();toast('Evidence verified in demo.')};
document.getElementById('done').onclick=()=>{const all=state();const s=all[id]||{logs:[]};if(!s.verified){toast('Done blocked — verify evidence first.');return}s.status='Done';s.logs=s.logs||[];s.logs.push({action:'Done',at:new Date().toISOString()});all[id]=s;save(all);render();toast('Done recorded locally.')};
document.getElementById('follow').onclick=()=>{const all=state();const s=all[id]||{logs:[]};s.status='Follow-up';s.logs=s.logs||[];s.logs.push({action:'Follow-up',at:new Date().toISOString()});all[id]=s;save(all);render();toast('Follow-up recorded locally.')};render();
</script></body></html>
